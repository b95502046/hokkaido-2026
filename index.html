<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道自駕 8D7N</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-tab { border-bottom: 3px solid #2563eb; color: #2563eb; }
        .tab-content { display: none; }
        .show { display: block; }
    </style>
</head>
<body class="bg-gray-50 pb-24">

    <div class="bg-white shadow-sm p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-car-side mr-2"></i>北海道自駕日記</h1>
        <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-full">2026.06.09 - 06.16</span>
    </div>

    <div id="itinerary-page" class="tab-content show p-4 space-y-4">
        <div class="bg-blue-600 text-white p-4 rounded-xl shadow-lg mb-6">
            <p class="text-sm opacity-80">租車預約：NICONICO 新千歲</p>
            <p class="text-xl font-bold">WAGON R (同級車)</p>
            <div class="flex justify-between mt-2 text-sm border-t border-blue-400 pt-2">
                <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=NICONICO+Rent+a+Car+New+Chitose+Airport')" class="bg-white text-blue-600 px-3 py-1 rounded-lg font-bold text-xs"><i class="fa-solid fa-location-arrow mr-1"></i>導航至店舖</button>
                <span>費用: ¥51,930</span>
            </div>
        </div>

        <div class="relative border-l-2 border-blue-200 ml-3 pl-6 space-y-8">
            <div class="relative"><span class="absolute -left-[31px] top-0 w-4 h-4 bg-blue-600 rounded-full border-4 border-white"></span>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold">Day 2: 小樽運河</h3>
                        <p class="text-sm text-gray-500">漫步運河、天狗山夜景</p>
                    </div>
                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Otaru+Canal')" class="text-blue-500 bg-blue-50 p-2 rounded-full"><i class="fa-solid fa-map"></i></button>
                </div>
            </div>
            <div class="relative"><span class="absolute -left-[31px] top-0 w-4 h-4 bg-gray-300 rounded-full border-4 border-white"></span>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold">Day 3: 神威岬 (積丹藍)</h3>
                        <p class="text-sm text-gray-500">欣賞斷崖海景、吃海鮮丼</p>
                    </div>
                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Cape+Kamui')" class="text-blue-500 bg-blue-50 p-2 rounded-full"><i class="fa-solid fa-map"></i></button>
                </div>
            </div>
            <div class="relative"><span class="absolute -left-[31px] top-0 w-4 h-4 bg-gray-300 rounded-full border-4 border-white"></span>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold">Day 4: 四季彩之丘</h3>
                        <p class="text-sm text-gray-500">美瑛拼布之路、青池導覽</p>
                    </div>
                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Shikisai+no+Oka')" class="text-blue-500 bg-blue-50 p-2 rounded-full"><i class="fa-solid fa-map"></i></button>
                </div>
            </div>
             <div class="relative"><span class="absolute -left-[31px] top-0 w-4 h-4 bg-gray-300 rounded-full border-4 border-white"></span>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold">Day 6: 登別地獄谷</h3>
                        <p class="text-sm text-gray-500">溫泉老街、大湯沼川足湯</p>
                    </div>
                    <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=Noboribetsu+Jigokudani')" class="text-blue-500 bg-blue-50 p-2 rounded-full"><i class="fa-solid fa-map"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="expense-page" class="tab-content p-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-6 text-center">
            <p class="text-gray-500 text-sm">目前累積支出</p>
            <p class="text-4xl font-black text-gray-800 mt-1">¥<span id="total-display">51,930</span></p>
        </div>

        <div class="space-y-3">
            <input id="ex-item" type="text" placeholder="支出項目" class="w-full p-4 rounded-xl border-none bg-white shadow-sm">
            <input id="ex-amount" type="number" placeholder="日幣金額" class="w-full p-4 rounded-xl border-none bg-white shadow-sm">
            <button onclick="addExp()" class="w-full bg-blue-600 text-white p-4 rounded-xl font-bold">加入明細</button>
        </div>

        <div class="mt-8">
            <h4 class="font-bold mb-4 text-gray-400 uppercase text-xs tracking-widest">支出清單</h4>
            <div id="list" class="space-y-2">
                </div>
        </div>
    </div>

    <div class="fixed bottom-0 w-full bg-white border-t flex justify-around p-3 pb-6 text-gray-400">
        <button onclick="switchTab('itinerary')" id="btn-itinerary" class="flex flex-col items-center active-tab">
            <i class="fa-solid fa-map-location-dot text-xl"></i>
            <span class="text-[10px] mt-1">行程表</span>
        </button>
        <button onclick="switchTab('expense')" id="btn-expense" class="flex flex-col items-center">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[10px] mt-1">記帳本</span>
        </button>
    </div>

    <script>
        // 初始化資料：從瀏覽器儲存空間讀取，沒有的話就預設租車費
        let expenses = JSON.parse(localStorage.getItem('hokkaido_expenses')) || [
            { item: '預估租車費', amount: 51930 }
        ];

        function renderExpenses() {
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = '';
            let total = 0;
            expenses.forEach((ex, index) => {
                total += ex.amount;
                const div = document.createElement('div');
                div.className = "flex justify-between bg-white p-4 rounded-lg text-sm shadow-sm";
                div.innerHTML = `<span class="text-gray-600">${ex.item}</span><span class="font-bold text-gray-800">¥${ex.amount.toLocaleString()}</span>`;
                listDiv.prepend(div);
            });
            document.getElementById('total-display').innerText = total.toLocaleString();
            localStorage.setItem('hokkaido_expenses', JSON.stringify(expenses));
        }

        function addExp() {
            const item = document.getElementById('ex-item').value;
            const amt = parseInt(document.getElementById('ex-amount').value);
            if(!item || !amt) return;
            expenses.push({ item, amount: amt });
            renderExpenses();
            document.getElementById('ex-item').value = '';
            document.getElementById('ex-amount').value = '';
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(p => p.classList.remove('show'));
            document.getElementById(type + '-page').classList.add('show');
            document.getElementById('btn-itinerary').classList.remove('active-tab');
            document.getElementById('btn-expense').classList.remove('active-tab');
            document.getElementById('btn-' + type).classList.add('active-tab');
        }

        // 初始載入
        renderExpenses();
    </script>
</body>
</html>
